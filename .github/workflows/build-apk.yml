name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cek file proyek
        run: |
          for f in package.json capacitor.config.json www/index.html scripts/prepare.js scripts/patch-android.js; do
            if [ ! -f "$f" ]; then echo "::error::File $f tidak ada di repo"; exit 1; fi
          done
          ls -la . www scripts

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Siapkan web (three.js lokal)
        run: node scripts/prepare.js

      - name: Tambah platform Android
        run: |
          rm -rf android
          npx cap add android

      - name: Patch landscape dan fullscreen
        run: node scripts/patch-android.js

      - name: Sync
        run: npx cap sync android

      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WAR-OF-ZOMBIES-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
